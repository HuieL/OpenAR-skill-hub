name: discovery

# Regenerates community/discovery.json (New / Recently Updated / Trending
# from public GitHub signals) and uploads it as a workflow artifact. The
# workflow never writes to the repository: hub main changes only through
# the Review merge (review verdict 2026-10-14). Any fetch failure exits
# nonzero without writing, so a failed run simply produces no artifact.
#
# Triggers: manual dispatch only while the org-wide Actions budget pause
# (2026-10-04) is in force. Restore conditions: when the pause lifts,
# uncomment the schedule below (weekly, off the hour) and keep dispatch.
# The GITHUB_TOKEN is used for public API rate limits only; it is never
# printed, stored, or sent anywhere but api.github.com.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit; bump deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Regenerate community/discovery.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-discovery.py
      - name: Validate
        run: |
          python3 scripts/validate.py
          python3 scripts/build-index.py --check
          python3 scripts/build-community.py --check
      # Pinned to the upload-artifact v4.4.3 commit; bump deliberately.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: discovery-json
          path: community/discovery.json
          retention-days: 7
