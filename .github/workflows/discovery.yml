name: discovery

# Regenerates community/discovery.json (New / Recently Updated / Trending
# from public GitHub signals) and commits the snapshot. Any fetch failure
# exits nonzero without writing, so the previous snapshot is kept.
#
# Triggers: manual dispatch only while the org-wide Actions budget pause
# (2026-10-04) is in force. Restore conditions: when the pause lifts,
# uncomment the schedule below (weekly, off the hour) and keep dispatch.
# The GITHUB_TOKEN is used for public API rate limits only; it is never
# printed, stored, or sent anywhere but api.github.com.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit; bump deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Regenerate community/discovery.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-discovery.py
      - name: Validate
        run: |
          python3 scripts/validate.py
          python3 scripts/build-index.py --check
          python3 scripts/build-community.py --check
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "openar-skill-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add community/discovery.json
          if git diff --cached --quiet; then
            echo "discovery.json unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Regenerate community/discovery.json [skip ci]"
          git push
